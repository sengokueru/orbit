<script>
'use strict';
// ===== 保存 =====
const KEY = 'eigyo-v1';
const STAGES = ['初回', '2回目', '3回目以降'];
let S = null;            // 保存している状態
let loadError = false;   // 保存データが壊れていた
const U = { view: 'home', sel: null, period: '30', line: { partner: '', draft: '', first: false, cid: '' }, dash: [], dashSel: -1, stale: false,
  last: {}, cf: 'all', csort: 'need', purpose: '', calMonth: '', calDay: '', imp: null, memoOut: null, locked: false, hiddenAt: 0 };

const RANKS = ['S', 'A', 'B', 'C'];
const ACCENTS = [['blue', '青', '#2a78d6'], ['red', '赤', '#cf3a3a'], ['pink', 'ピンク', '#d03d86'], ['purple', '紫', '#7651d4'], ['green', '緑', '#168456'], ['gold', '金', '#946c00']];
const TONES = [['soft', 'やさしく'], ['bright', '明るく'], ['cool', '大人っぽく']];
function blankSettings() { return { gap: 3, workDays: [1, 2, 3, 4, 5, 6], rankS: 300000, rankA: 100000, accent: 'blue', theme: 'auto', pin: '', salt: '', myName: '', lastBackup: '' }; }
function blank() { return { v: 2, customers: [], firsts: [], events: [], diary: [], goals: {}, settings: blankSettings() }; }
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
const str = (x, max = 500) => (typeof x === 'string' ? x : '').slice(0, max);
const num = x => (typeof x === 'number' && isFinite(x) && x >= 0 ? Math.round(x) : 0);
const numOrNull = x => (typeof x === 'number' && isFinite(x) ? x : null);
const strArr = (a, n = 10, max = 60) => (Array.isArray(a) ? a.filter(x => typeof x === 'string' && x.trim()).slice(0, n).map(x => x.slice(0, max)) : []);
// LINEの分析結果は、画面で使う項目だけを残す（トーク全文は保存しない）
function normLine(x) {
  if (!x || typeof x !== 'object') return null;
  const arr = a => (Array.isArray(a) ? a : []);
  return { importedAt: validYmd(x.importedAt) ? x.importedAt : '', me: str(x.me, 40), partner: str(x.partner, 40),
    from: validYmd(x.from) ? x.from : '', to: validYmd(x.to) ? x.to : '',
    count: { me: num(x.count && x.count.me), partner: num(x.count && x.count.partner) },
    replyRate: numOrNull(x.replyRate), replyMin: numOrNull(x.replyMin), myReplyMin: numOrNull(x.myReplyMin), initRate: numOrNull(x.initRate),
    lenRatio: numOrNull(x.lenRatio), qRate: numOrNull(x.qRate), lastFrom: x.lastFrom === 'me' ? 'me' : x.lastFrom === 'partner' ? 'partner' : '',
    lastAt: num(x.lastAt), unanswered: !!x.unanswered, lastPartnerText: str(x.lastPartnerText, 200), myStreak: num(x.myStreak),
    score: Math.min(100, num(x.score)), label: str(x.label, 10), trend: ['up', 'down', 'flat'].includes(x.trend) ? x.trend : null,
    parts: arr(x.parts).filter(p => p && typeof p === 'object').slice(0, 8).map(p => ({ k: str(p.k, 20), v: str(String(p.v == null ? '' : p.v), 20) })),
    bestHours: arr(x.bestHours).filter(h => Number.isInteger(h) && h >= 0 && h < 24).slice(0, 3),
    topics: arr(x.topics).filter(t => t && typeof t.w === 'string').slice(0, 8).map(t => ({ w: t.w.slice(0, 30), n: num(t.n) })),

}

  for (const c of s.customers) for (const a of customerAlerts(c, s, t)) out.push({ lv: a.lv, text: c.name + '：' + a.text, cid: c.id, k: a.k });

function avgOfAll(s) { const vs = s.customers.flatMap(c => c.visits).filter(v => v.amt > 0); return vs.length ? sum(vs, v => v.amt) / vs.length : 0; }

// --- 分析 ---
function monthBars(s, t) {
  const ms = []; const base = parseYmd(ym(t) + '-01');
  for (let i = 5; i >= 0; i--) { const d = new Date(base.getFullYear(), base.getMonth() - i, 1); const m = ymd(d).slice(0, 7); ms.push({ m, ...monthStats(s, m) }); }
  const W = 340, H = 170, L = 40, B = 24, T = 16, pw = W - L - 6, ph = H - T - B, max = Math.max(1, ...ms.map(x => x.sales));
  // 目盛りは4本。1・2・5の倍数できりよく
  const raw = max / 4, p10 = Math.pow(10, Math.floor(Math.log10(raw))), top = [1, 2, 5, 10].map(x => x * p10).find(x => x >= raw) * 4;
  const bw = pw / ms.length * 0.6;
  let svg = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="月ごとの売上">`;
  for (let i = 0; i <= 4; i++) { const v = top / 4 * i, y = T + ph - v / top * ph; svg += `<line x1="${L}" x2="${W - 6}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${L - 6}" y="${y + 4}" text-anchor="end" font-size="11" fill="var(--ink2)">${v >= 10000 ? Math.round(v / 10000) + '万' : yen(v)}</text>`; }
  ms.forEach((x, i) => {
    const cx = L + pw / ms.length * (i + 0.5), h = x.sales / top * ph;
    svg += `<rect x="${cx - bw / 2}" y="${T + ph - h}" width="${bw}" height="${Math.max(0, h)}" rx="3" fill="var(--accent)"/><text x="${cx}" y="${H - 7}" text-anchor="middle" font-size="11" fill="var(--ink2)">${Number(x.m.slice(5))}月</text>`;
  });
  return { svg: svg + '</svg>', ms };
}
function vStats() {
  const t = today(), from90 = addDays(t, -89), cs = S.customers;
  const { svg, ms } = monthBars(S, t), cur = ms[ms.length - 1], prev = ms[ms.length - 2];
  const by = { S: [], A: [], B: [], C: [] };
  for (const c of cs) by[rankOf(c, S, t)].push(c);
  const amt90 = c => sum(visitsIn(c, from90, t), v => v.amt);
  const total90 = sum(cs, amt90);
  const top5 = [...cs].sort((a, b) => amt90(b) - amt90(a)).slice(0, 5);
  const risk = cs.map(c => ({ c, a: customerAlerts(c, S, t).find(a => a.k === 'churn' || a.k === 'away') })).filter(x => x.a);
  // 伸びている客：直近60日の来店が、その前の60日より多い
  const grow = cs.map(c => ({ c, n1: visitsIn(c, addDays(t, -59), t).length, n0: visitsIn(c, addDays(t, -119), addDays(t, -60)).length })).filter(x => x.n1 > x.n0 && x.n1 >= 2).sort((a, b) => (b.n1 - b.n0) - (a.n1 - a.n0)).slice(0, 5);
  // 伸びしろ：1回の平均が高いのに、来る回数が少ない
  const avgAll = avgOfAll(S);
  const room = cs.filter(c => avgSpend(c) >= avgAll * 1.3 && visitsIn(c, from90, t).length <= 2 && c.visits.length >= 1).sort((a, b) => avgSpend(b) - avgSpend(a)).slice(0, 5);
  const tile = (k, v, sub) => `<div class="tile"><div class="k">${k}</div><div class="v">${v}</div>${sub ? `<div class="small">${sub}</div>` : ''}</div>`;

// --- 日報のグラフ ---
const SER = ['var(--s1)', 'var(--s2)', 'var(--s3)'];
function lineSvg(months) {
  const W = 340, H = 210, L = 40, R = 10, T = 10, B = 26, pw = W - L - R, ph = H - T - B;
  const series = months.map(m => { let c = 0; return [[0, 0], ...m.days.map(x => [x.d, (c += x.t)])]; });
  const ymax = Math.max(1, ...series.map(s => s[s.length - 1][1]));
  const step = Math.pow(10, Math.floor(Math.log10(ymax))); const top = Math.ceil(ymax / step) * step;
  const X = d => L + d / 31 * pw, Y = v => T + ph - v / top * ph;
  let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="日ごとの売上の累計">`;
  for (let i = 0; i <= 4; i++) { const v = top / 4 * i; s += `<line x1="${L}" x2="${L + pw}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${L - 6}" y="${Y(v) + 4}" text-anchor="end" font-size="11" fill="var(--ink2)">${v >= 10000 ? Math.round(v / 10000) + '万' : yen(v)}</text>`; }
  for (const d of [1, 10, 20, 31]) s += `<text x="${X(d)}" y="${H - 10}" text-anchor="middle" font-size="11" fill="var(--ink2)">${d}日</text>`;
  series.forEach((pts, i) => {
    s += `<path d="${pts.map((p, j) => (j ? 'L' : 'M') + X(p[0]).toFixed(1) + ',' + Y(p[1]).toFixed(1)).join(' ')}" fill="none" stroke="${SER[i]}" stroke-width="2.5" stroke-linejoin="round"/>`;
    const [lx, ly] = pts[pts.length - 1];
    s += `<circle cx="${X(lx)}" cy="${Y(ly)}" r="4" fill="${SER[i]}" stroke="var(--card)" stroke-width="2"/>`;
  });
  return s + '</svg>';
}
function rateSvg(months) {
  const W = 340, H = 180, L = 34, R = 6, T = 18, B = 26, pw = W - L - R, ph = H - T - B, top = 0.5;
  const Y = v => T + ph - Math.min(v, top) / top * ph;
  let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="直し率と返し率">`;
  for (let i = 0; i <= 5; i++) { const v = top / 5 * i; s += `<line x1="${L}" x2="${L + pw}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${L - 6}" y="${Y(v) + 4}" text-anchor="end" font-size="11" fill="var(--ink2)">${Math.round(v * 100)}%</text>`; }
  const gw = pw / Math.max(1, months.length), bw = Math.min(34, gw * 0.32);
  months.forEach((m, i) => {
    const gx = L + gw * i + gw / 2;
    [[m.nao, 'var(--s1)'], [m.kae, 'var(--s2)']].forEach(([v, col], j) => {
      if (!isNum(v)) return;
      const x = gx - bw - 1 + j * (bw + 2), y = Y(v);
      s += `<rect x="${x}" y="${y}" width="${bw}" height="${T + ph - y}" rx="3" fill="${col}"/><text x="${x + bw / 2}" y="${y - 4}" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ink)">${(v * 100).toFixed(1)}%</text>`;
    });
    s += `<text x="${gx}" y="${H - 8}" text-anchor="middle" font-size="12" fill="var(--ink)">${esc(m.label)}</text>`;
  });
  return s + '</svg>';
}

const photoCache = {};
let photoDbP = null;
function photoDb() {
  if (!photoDbP) photoDbP = new Promise((ok, ng) => {
    if (typeof indexedDB === 'undefined') { ng(new Error('IndexedDBがありません')); return; }
    const r = indexedDB.open('eigyo-photos', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('p');
    r.onsuccess = () => ok(r.result); r.onerror = () => ng(r.error);
  });
  return photoDbP;
}
async function photoTx(mode, fn) {
  const db = await photoDb();
  return new Promise((ok, ng) => {
    const tx = db.transaction('p', mode), req = fn(tx.objectStore('p'));
    tx.oncomplete = () => ok(req && req.result); tx.onerror = () => ng(tx.error); tx.onabort = () => ng(tx.error);
  });
}
const photoGet = id => (photoCache[id] ? Promise.resolve(photoCache[id]) : photoTx('readonly', st => st.get(id)).then(v => { if (v) photoCache[id] = v; return v; }));
const photoPut = (id, v) => photoTx('readwrite', st => st.put(v, id)).then(() => { photoCache[id] = v; });
function photoDel(id) { delete photoCache[id]; photoTx('readwrite', st => st.delete(id)).catch(() => {}); }
function hydratePhotos() {
  for (const img of document.querySelectorAll('img[data-photo]')) {
    const id = img.dataset.photo;
    photoGet(id).then(v => { if (v) img.src = v; else img.removeAttribute('data-photo'); }).catch(() => {});
  }
}
// 写真は長い辺を max px の JPEG に縮めて保存する
function shrinkImage(file, max) {
  return new Promise((ok, ng) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const r = Math.min(1, max / Math.max(img.width, img.height)), w = Math.max(1, Math.round(img.width * r)), h = Math.max(1, Math.round(img.height * r));
      const cv = document.createElement('canvas'); cv.width = w; cv.height = h; cv.getContext('2d').drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url); ok(cv.toDataURL('image/jpeg', 0.78));
    };
    img.onerror = () => { URL.revokeObjectURL(url); ng(new UserError('画像を読み込めませんでした')); };
    img.src = url;
  });
}

// Browser speech recognition may send audio to its provider; do not start it in this local-only app.
const SpeechRec = null;
function speechOk() { return !!SpeechRec; }
let rec = null;
function startSpeech(target) {
  if (!SpeechRec) { toast('この端末では使えません。キーボードのマイクを使ってください'); return; }
  if (rec) { rec.stop(); return; }
  rec = new SpeechRec(); rec.lang = 'ja-JP'; rec.interimResults = false; rec.continuous = true;
  rec.onresult = e => {
    const el = document.getElementById(target); if (!el) return;
    for (let i = e.resultIndex; i < e.results.length; i++) if (e.results[i].isFinal) el.value += (el.value && !/[、。\n]$/.test(el.value) ? '、' : '') + e.results[i][0].transcript;
  };
  rec.onend = () => { rec = null; toast('音声を止めました'); };
  rec.onerror = () => { toast('音声を聞き取れませんでした'); };
  rec.start(); toast('話してください（もう一度押すと止まります）');
}

// ===== トーク履歴を読む =====
// LINEの .txt は端末や版で文字コードが違うことがある。UTF-8 → UTF-16 → Shift_JIS の順に試す
async function readTalkFile(file) {
  const b = new Uint8Array(await file.arrayBuffer());
  if (b[0] === 0x50 && b[1] === 0x4B) throw new UserError('zip ファイルです。中の .txt を取り出してから選んでください');
  if (b[0] === 0xFF && b[1] === 0xFE) return new TextDecoder('utf-16le').decode(b);
  if (b[0] === 0xFE && b[1] === 0xFF) return new TextDecoder('utf-16be').decode(b);
  let z = 0, pairs = 0;
  for (let i = 1; i < Math.min(b.length, 4000); i += 2) { pairs++; if (b[i] === 0) z++; }
  if (pairs && z / pairs > 0.2) return new TextDecoder('utf-16le').decode(b);
  try { return new TextDecoder('utf-8', { fatal: true }).decode(b); }
  catch (_) { try { return new TextDecoder('shift_jis').decode(b); } catch (e) { return new TextDecoder('utf-8').decode(b); } }
}
// 読めなかった時に見せる「形」：数字は9・英字はa・それ以外の文字は「字」に伏せる（中身は出さない）
function talkShape(text) {
  return String(text || '').replace(/^\uFEFF/, '').split(/\r\n|\n|\r/).filter(l => l.trim()).slice(0, 10)
    .map(l => l.replace(/[0-9０-９]/g, '9').replace(/[A-Za-z]/g, 'a').replace(/[^\s9a\/.:：\-()（）\[\],、]/g, '字').replace(/字{4,}/g, '字字字…').replace(/\t/g, '⇥').replace(/ /g, '␣').slice(0, 40));
}
function importFailed(msg, text) {
  U.imp = null; U.impErr = { msg, shape: talkShape(text), lines: String(text || '').split(/\r\n|\n|\r/).length };
  render();
}
function startImport(text) {
  if (!hasAnalyze()) { toast('分析の部品を読み込めませんでした'); return; }
  let P;
  try { P = parseLineTalk(text); } catch (e) { console.error(e); importFailed('読み込めませんでした', text); return; }
  if (!P || P.error || !P.messages || !P.messages.length) { importFailed('LINEのトーク履歴の形として読めませんでした', text); return; }
  U.impErr = null;
  const names = P.senders.map(x => x.name);
  const me = names.includes(S.settings.myName) ? S.settings.myName : (names.find(n => n !== P.partner) || names[0]);
  const partnerName = P.partner || names.find(n => n !== me) || '';
  const match = S.customers.find(c => c.name === partnerName || (c.line && c.line.partner === partnerName));
  U.imp = { parsed: P, me, partnerName, cid: match ? match.id : '', a: null };
  analyzeImport();
}
function analyzeImport() {
  const I = U.imp; if (!I) return;
  try { I.a = normLine(analyzeLineTalk(I.parsed, I.me, Date.now())); }
  catch (e) { console.error(e); I.a = null; toast('分析できませんでした'); }
  render();
}

  const app = document.getElementById('app'), nav = document.getElementById('nav');
  if (app.inert) return;
  app.inert = true; nav.inert = true;
  return withStoreLock(() => {
    try {
      const r = f(el);
      if (r !== false) render(CLEAR[name]);
    } catch (e) {
      if (e instanceof UserError) toast(e.message);
      else { console.error(e); toast('保存できませんでした'); }
    }
  }).catch(() => toast('保存できませんでした')).finally(() => { app.inert = false; nav.inert = false; });
}
async function importBackup(file) {
  try {
    const data = JSON.parse(await file.text());
    if (!data || (data.v !== 1 && data.v !== 2) || !Array.isArray(data.customers)) throw new UserError('このアプリのバックアップではありません');
    const s = normalize(data);
    if (!confirm('今のデータを、バックアップ（客' + s.customers.length + '人・初回' + s.firsts.length + '件）で置き換えますか？')) return;
    // パスコードは戻さない（忘れて開けなくなるのを防ぐ）。いまの端末の設定を残す
    if (S && S.settings) { s.settings.pin = S.settings.pin; s.settings.salt = S.settings.salt; }
    await withStoreLock(() => {
      const latest = load();
      if (!loadError) { s.settings.pin = latest.settings.pin; s.settings.salt = latest.settings.salt; }
      s.revision = Math.max(num(latest.revision), num(s.revision)) + 1;
      const raw = JSON.stringify(s); localStorage.setItem(KEY, raw); writeBase = raw;
      S = s; loadError = false; formDrafts.clear(); U.imp = null; U.sel = null;
      document.getElementById('app').dataset.context = '';
    });
    let bad = 0;
    if (data.photos && typeof data.photos === 'object') for (const [id, v] of Object.entries(data.photos)) {
      if (!/^ph-[a-z0-9]+$/.test(id) || typeof v !== 'string' || !v.startsWith('data:image/')) continue;
      try { await photoPut(id, v); } catch (_) { bad++; }
    }
    render(); toast(bad ? '戻しました（写真' + bad + '枚は戻せませんでした）' : '戻しました');
  } catch (e) { toast(e instanceof UserError ? e.message : e instanceof SyntaxError ? '読み込めませんでした' : '保存できませんでした'); }
}
async function loadNippo(files) {
  for (const file of files) {
    try {
      const sheets = await readXlsx(await file.arrayBuffer(), ['組数売上', '月間報告']);
      const m = analyzeNippo(sheets, file.name);
      U.dash = U.dash.filter(x => x.label !== m.label).concat(m).sort((a, b) => a.month - b.month);
    } catch (e) { console.error(e); toast(file.name + '：' + (e.message || '読み込めませんでした')); }
  }
  U.dashSel = U.dash.length - 1;
  const inp = document.getElementById('dashFile'); if (inp) inp.value = '';
  render();
}

function boot() {
  S = load();
  U.locked = !!S.settings.pin;
  document.addEventListener('click', e => {
    if (U.locked && !e.target.closest('[data-act="unlock"]')) return;
    const n = e.target.closest('[data-nav]');
    if (n) { goNav(n.dataset.nav); render(); window.scrollTo(0, 0); return; }
    const g = e.target.closest('[data-go]');
    if (g) { goTo(g.dataset.go); render(); window.scrollTo(0, 0); return; }
    const a = e.target.closest('[data-act]');
    if (a) { e.preventDefault(); run(a.dataset.act, a); }
  });
  document.addEventListener('keydown', e => { if (U.locked && e.key === 'Enter' && e.target.id === 'pin-in') run('unlock', e.target); });
  document.addEventListener('input', e => {
    if (e.target.id === 'cq') { filterCustomers(); return; }
    if (e.target.dataset && e.target.dataset.draft) { updateDraftScores(); return; }
    if (U.locked && e.target.id === 'pin-in' && e.target.value.length === 4) { run('unlock', e.target); return; }
    const k = e.target.dataset && e.target.dataset.line;
    if (!k) return;
    U.line[k] = e.target.type === 'checkbox' ? e.target.checked : e.target.value;
    updateLineResult();
  });
  document.addEventListener('change', e => {
    const id = e.target.id;
    if (/-bday-m$/.test(id)) syncBday(id.slice(0, -2));
    if (id === 'importFile' && e.target.files[0]) importBackup(e.target.files[0]);
    if (id === 'dashFile' && e.target.files.length) loadNippo([...e.target.files]);
    if (id === 'talkFile' && e.target.files[0]) { const f = e.target.files[0]; e.target.value = ''; readTalkFile(f).then(startImport, err => importFailed(err instanceof UserError ? err.message : 'ファイルを開けませんでした', '')); }
    if (id === 'p-photo' && e.target.files[0]) savePhoto(e.target.files[0], 'face');
    if (id === 'dy-photo' && e.target.files[0]) savePhoto(e.target.files[0], 'diary', e.target.dataset.d);
    if (id === 'csort') { U.csort = e.target.value; render(); }
    if (id === 'cmp-cid') { U.sel = e.target.value || null; U.purpose = ''; render(); }
    if (id === 'imp-me' && U.imp) { U.imp.me = e.target.value; analyzeImport(); }
    if (id === 'imp-cid' && U.imp) U.imp.cid = e.target.value;
    if (e.target.dataset && e.target.dataset.line) { const k = e.target.dataset.line; U.line[k] = e.target.type === 'checkbox' ? e.target.checked : e.target.value; updateLineResult(); }
  });
  // パスコードを使っている時：30秒以上ほかのアプリを見ていたら、戻った時にもう一度聞く
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { U.hiddenAt = Date.now(); return; }
    if (S.settings.pin && !U.locked && U.hiddenAt && Date.now() - U.hiddenAt > 30000) { U.locked = true; render(); }
    refreshDay();
  });
  // Refresh the dates after a night in the background; dirty fields stay in their own context.
  function refreshDay() {
    if (U.renderDay === today() || document.getElementById('app').inert) return;
    // A goal being edited still belongs to the month printed on its save button.
    if (U.view === 'goal' && Object.keys(snapshot()?.f || {}).length) return;
    render();
  }
  window.addEventListener('focus', refreshDay);
  setInterval(refreshDay, 60000);
  // 別のタブで保存されたら：入力中でなければすぐ反映、入力中なら知らせるだけ（入力を消さない）
  window.addEventListener('storage', e => {
    if (e.key !== KEY) return;
    const a = document.activeElement;
    if (a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && a.closest('#app')) {
      if (!U.stale) { U.stale = true; const b = document.createElement('div'); b.className = 'banner'; b.innerHTML = '別のタブで内容が変わりました。<button class="btn sm" data-act="refresh">最新にする</button>'; document.getElementById('app').prepend(b); }
      return;
    }
    U.stale = false; S = load(); render();
  });
  render();
  if (S.customers.length) askPersist();
  // Android の Chrome など：自前の「インストールする」ボタンから入れられるようにする
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; if (U.view === 'home' && !document.getElementById('app').inert) render(); });
  window.addEventListener('appinstalled', () => { installEvt = null; setUi({ installHidden: true }); if (U.view === 'home' && !document.getElementById('app').inert) render(); });
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    // 開いたままの古い画面に、新しい版が届いた時だけ知らせる（開いた画面がもう新しい版なら知らせない）
    const hadCtrl = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (!hadCtrl || U.updated) return;
      fetch('sw.js', { cache: 'no-store' }).then(r => r.text()).then(t => {
        const m = /PREFIX \+ '(v\d+)'/.exec(t);
        if (m && m[1] !== APP_VERSION) { U.updated = true; if (!document.getElementById('app').inert) render(); }
      }).catch(() => {});
    });
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
}
boot();
</script>
